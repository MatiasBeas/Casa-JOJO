<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Casa JoJo</title>
<style>
:root{--bg:#121212;--s1:#1e1e1e;--s2:#2a2a2a;--gold:#F59E0B;--gold2:#D97706;--text:#f2f0ea;--mut:#a09b90;--ok:#22c55e;--err:#ef4444;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--text);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px}
.roles{display:flex;background:var(--s1);border-radius:24px;padding:4px}
.roles button{border:0;background:none;color:var(--mut);padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer}
.roles button.on{background:var(--gold);color:#111;font-weight:700}
.phone{width:380px;height:780px;background:#0a0a0a;border:2px solid #333;border-radius:44px;padding:10px;position:relative;flex-shrink:0}
.app{background:var(--bg);width:100%;height:100%;border-radius:34px;overflow:hidden;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;padding:10px 22px 4px;font-size:12px;font-weight:600}
main{flex:1;overflow-y:auto;padding:8px 18px 18px}
h1{font-size:26px}h2{font-size:17px;margin:20px 0 10px;color:var(--gold)}
.sub{color:var(--mut);font-size:14px;margin:4px 0 14px}
.logo{text-align:center;margin:20px 0 6px;font-size:44px}
.tabs{display:flex;background:var(--s1);border-radius:24px;padding:4px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:20px;font-size:14px;cursor:pointer}
.tabs .on{background:var(--s2);color:var(--gold);font-weight:700}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input,textarea,select{width:100%;background:transparent;border:1.5px solid #4a4a4a;border-radius:14px;padding:13px 14px;color:var(--text);font:inherit;font-size:15px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--gold)}
select option{background:#222}
.btn{width:100%;border:0;border-radius:28px;padding:15px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#111;font-weight:700;font-size:15px;cursor:pointer;margin-top:18px;box-shadow:0 4px 14px rgba(245,158,11,.3)}
.link{color:var(--gold);font-size:13px;text-align:center;display:block;margin-top:14px;cursor:pointer;text-decoration:underline}
.card{background:var(--s1);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.5);border:1.5px solid transparent}
.dish{display:flex;align-items:center;gap:12px;cursor:pointer}
.dish.sel{border-color:var(--gold);background:#2a2110}
.dish.out{opacity:.45;cursor:not-allowed}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex-shrink:0}
.sel .dot{border-color:var(--gold);background:radial-gradient(var(--gold) 45%,transparent 50%)}
.dish b{font-size:15px;display:block}.dish span{font-size:12px;color:var(--mut)}
.badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:700;margin-left:auto;white-space:nowrap}
.b-out{background:var(--err);color:#fff}.b-pend{background:#78350f;color:#fcd34d}.b-paid{background:#14532d;color:#86efac}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #4a4a4a;background:none;color:var(--text);padding:9px 14px;border-radius:12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#111;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0}
.row span:first-child{color:var(--mut)}
.qty{display:flex;align-items:center;gap:16px}
.qty button{width:38px;height:38px;border-radius:50%;border:0;background:var(--gold);font-size:20px;font-weight:700;cursor:pointer}
.qty b{font-size:20px;min-width:20px;text-align:center}
.pay{display:flex;gap:12px;align-items:center;cursor:pointer}
.bank{background:var(--s2);border-radius:12px;padding:12px;font-size:13px;color:var(--mut);margin-top:10px;line-height:1.6}
.bank b{color:var(--text)}
.foot{padding:10px 18px;border-top:1px solid #2a2a2a;background:var(--bg)}.foot .btn{margin:0}
nav{display:flex;border-top:1px solid #2a2a2a;background:var(--s1);padding:8px 6px 16px}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{font-style:normal;font-size:19px;padding:3px 20px;border-radius:14px}
nav .on{color:var(--gold);font-weight:700}nav .on i{background:#3a2a08}
.steps{display:flex;margin:16px 0 6px}
.st{flex:1;text-align:center;font-size:10px;color:var(--mut);position:relative}
.st i{display:block;width:22px;height:22px;border-radius:50%;background:var(--s2);margin:0 auto 6px;position:relative;z-index:1;line-height:22px;font-style:normal;font-size:12px}
.st:not(:last-child)::after{content:"";position:absolute;top:10px;left:50%;width:100%;height:3px;background:var(--s2)}
.st.done{color:var(--text)}.st.done i,.st.done::after{background:var(--gold);color:#111}
.sw{position:relative;width:46px;height:26px;flex-shrink:0}
.sw input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;z-index:2}
.sw s{position:absolute;inset:0;background:#4a4a4a;border-radius:13px;transition:.2s}
.sw s::after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+s{background:var(--gold)}.sw input:checked+s::after{transform:translateX(20px)}
.logoimg{display:block;width:200px;max-width:70%;margin:14px auto 6px;border-radius:18px}.avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;font-size:34px;font-weight:700;display:grid;place-items:center;margin:0 auto 8px}.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:10px 18px;border-radius:14px;font-size:13px;z-index:9}
@media (max-width:440px){body{padding:0;gap:0;justify-content:flex-start}.roles{margin:8px}.phone{width:100%;height:calc(100vh - 52px);border:0;border-radius:0;padding:0}.app{border-radius:0}}
</style></head>
<body>
<div class="roles"><button id="rc" class="on" onclick="setRole('client')">👤 Cliente</button><button id="ra" onclick="setRole('admin')">🧑‍🍳 Operador</button></div>
<div class="phone"><div class="app" id="app"></div></div>

const SIDES=['Puré (natural)','Arroz normal','Arroz integral','Verduras salteadas','Fideos blancos','Fideos al pesto'],SALADS=['Mix de ensaladas'],EXTRAS=['Sin extra','Bebida','Postre del día','Jugo natural'];
const $=id=>document.getElementById(id);
const go=s=>{S.screen=s;render()};
const setRole=r=>{S.role=r;$('rc').className=r=='client'?'on':'';$('ra').className=r=='admin'?'on':'';render()};
const toast=m=>{S.toast=m;render();setTimeout(()=>{S.toast='';render()},1800)};
const cur=()=>S.dishes.find(d=>d.id==S.dish);
function pick(id){const d=S.dishes.find(x=>x.id==id);if(d.o)return;S.dish=id;render()}
function togSide(x){const i=S.sides.indexOf(x);if(i>-1)S.sides.splice(i,1);else if(S.sides.length<2)S.sides.push(x);else return toast('Máximo 2 agregados');render()}
function qty(d){S.qty=Math.min(6,Math.max(1,S.qty+d));render()}
function toStock(id){const d=S.dishes.find(x=>x.id==id);d.o=d.o?0:1;if(S.dish==id&&d.o)S.dish=null;render()}
function confirmOrder(){
 if(!S.dish)return toast('Elige un plato de fondo');
 const id=Date.now()%100000;
 S.orders.push({id,client:S.name,dish:cur().n,qty:S.qty,time:S.time,status:'Recibido',paid:false,det:[S.sides.join(', ')||'Sin agregados',S.salad||'Sin ensalada',S.extra].join(' · '),notes:S.notes});
 S.active=id;S.dish=null;S.sides=[];S.salad=null;S.qty=1;S.notes='';go('track')}
function authView(){
 const f=(l,t,ph)=>`<label>${l}</label><input type="${t}" placeholder="${ph}">`;
 let body='';
 if(S.tab=='login')body=f('Correo electrónico','email','tu@correo.cl')+f('Contraseña','password','••••••••')+`<span class="link" style="text-align:right;margin:8px 0 0" onclick="S.tab='forgot';render()">¿Olvidaste tu contraseña?</span><button class="btn" onclick="go('menu')">Iniciar sesión</button>`;
 else if(S.tab=='reg')body=`<label>Nombre completo</label><input id="nm" placeholder="Juan Pérez">`+f('Correo electrónico','email','tu@correo.cl')+f('Teléfono','tel','+56 9 1234 5678')+f('Contraseña','password','Mínimo 8 caracteres')+`<button class="btn" onclick="regDone()">Crear cuenta</button>`;
 else body=`<p class="sub">Te enviaremos un enlace para restablecer tu contraseña.</p>`+f('Correo electrónico','email','tu@correo.cl')+`<button class="btn" onclick="toast('Enlace enviado ✉️')">Enviar enlace</button><span class="link" onclick="S.tab='login';render()">Volver a iniciar sesión</span>`;
 return `<main><img class="logoimg" src="${LOGO}"><p class="sub" style="text-align:center">Almuerzos caseros, listos a tu hora</p>
 ${S.tab!='forgot'?`<div class="tabs"><button class="${S.tab=='login'?'on':''}" onclick="S.tab='login';render()">Iniciar Sesión</button><button class="${S.tab=='reg'?'on':''}" onclick="S.tab='reg';render()">Registrarse</button></div>`:''}${body}</main>`}
function menuView(){
 let h=`<main><p class="sub" style="margin:6px 0 0">Bienvenido, ${S.name.split(' ')[0]} 👋</p><div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><img src="${LOGO}" style="height:52px;border-radius:12px"><div><h1 style="font-size:22px">Arma tu menú</h1><p class="sub" style="margin:0">Menú del día</p></div></div>`;
 [4600,4800].forEach(p=>{h+=`<h2>Menú ${fmt(p)}</h2>`;S.dishes.filter(d=>d.p==p).forEach(d=>{
  h+=`<div class="card dish ${S.dish==d.id?'sel':''} ${d.o?'out':''}" onclick="pick(${d.id})"><div class="dot"></div><div><b>${d.n}</b><span>${d.ae?'+ Agregado + Ensalada':'Plato de fondo'}</span></div>${d.o?'<span class="badge b-out">Agotado</span>':''}</div>`})});
 h+=`<h2>Agregados de hoy <span style="color:var(--mut);font-size:12px">(elige 1 o 2)</span></h2><div class="chips">${SIDES.map(x=>`<button class="chip ${S.sides.includes(x)?'on':''}" onclick="togSide('${x}')">${x}</button>`).join('')}</div>
 <h2>Ensalada</h2><div class="chips">${SALADS.map(x=>`<button class="chip ${S.salad==x?'on':''}" onclick="S.salad='${x}';render()">${x}</button>`).join('')}</div>
 <button class="btn" onclick="S.dish?go('order'):toast('Elige un plato de fondo')">Continuar con el pedido</button></main>`;return h}
function orderView(){
 const d=cur();if(!d)return `<main><h2>Aún no eliges un plato</h2><button class="btn" onclick="go('menu')">Ir al menú</button></main>`;
 return `<main><h1>Tu pedido</h1><p class="sub">Revisa y confirma</p>
 <div class="card"><div class="row"><span>Fondo</span><b>${d.n}</b></div><div class="row"><span>Agregados</span><b>${S.sides.join(', ')||'—'}</b></div><div class="row"><span>Ensalada</span><b>${S.salad||'—'}</b></div>
 <div class="row"><span>Bebida / Postre</span><select style="width:auto;padding:6px 10px;font-size:13px" onchange="S.extra=this.value">${EXTRAS.map(x=>`<option ${x==S.extra?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <label>Notas o restricciones alimentarias (alergias, sin sal, etc.)</label><textarea rows="3" placeholder="Ej: sin sal, alergia a maní" oninput="S.notes=this.value">${S.notes}</textarea>

 <h2>Cantidad de menús</h2><div class="card row"><div class="qty"><button onclick="qty(-1)">−</button><b>${S.qty}</b><button onclick="qty(1)">+</button></div><span style="font-size:12px;text-align:right">${S.qty>=3?'🏢 Pedido empresa':'Pedidos de 3 a 6 = empresas'}</span></div>
 <h2>Método de pago</h2>
 <div class="card pay" onclick="S.pay='cash';render()"><div class="dot" style="${S.pay=='cash'?'border-color:var(--gold);background:radial-gradient(var(--gold) 45%,transparent 50%)':''}"></div>Efectivo al retirar</div>
 <div class="card pay" onclick="S.pay='bank';render()"><div class="dot" style="${S.pay=='bank'?'border-color:var(--gold);background:radial-gradient(var(--gold) 45%,transparent 50%)':''}"></div>Transferencia bancaria</div>
 ${S.pay=='bank'?`<div class="bank"><b>Banco Estado · Cuenta Vista</b><br>N° 000123456789<br>La Casa JoJo SpA · RUT 76.123.456-7<br>pagos@lacasajojo.cl</div>`:''}
 <div class="card row" style="margin-top:14px"><span>Total</span><b style="color:var(--gold);font-size:20px">${fmt(d.p*S.qty)}</b></div></main>
 <div class="foot"><button class="btn" onclick="confirmOrder()">Confirmar Pedido</button></div>`}
function trackView(){
 const o=S.orders.find(x=>x.id==S.active);let h=`<main><h1>Mis pedidos</h1><p class="sub">Seguimiento en tiempo real</p><h2>Pedido activo</h2>`;
 if(!o)h+=`<div class="card"><p class="sub" style="margin:0">No tienes pedidos activos.</p></div>`;
 else{const i=STEPS.indexOf(o.status);h+=`<div class="card"><div class="row"><b>#${o.id} · ${o.qty}× ${o.dish}</b><span class="badge ${o.paid?'b-paid':'b-pend'}">${o.paid?'Pagado':'Pendiente de Pago'}</span></div>
 <div class="row"><span>Retiro a las</span><b>${o.time}</b></div><div class="steps">${STEPS.map((s,k)=>`<div class="st ${k<=i?'done':''}"><i>${k<i?'✓':k+1}</i>${s}</div>`).join('')}</div></div>`}
 h+=`<h2>Historial</h2>`+S.hist.map(x=>`<div class="card row"><div><b style="font-size:14px">${x.t}</b><br><span style="font-size:12px;color:var(--mut)">${x.d}</span></div><b>${fmt(x.p)}</b></div>`).join('')+`</main>`;return h}
function adminView(){
 const L=[...S.orders].sort((a,b)=>a.time.localeCompare(b.time));const price=o=>(S.dishes.find(d=>d.n==o.dish)||{p:0}).p*o.qty;const due=S.orders.filter(o=>!o.paid).reduce((a,o)=>a+price(o),0);
 let h=`<main><div style="display:flex;align-items:center;gap:12px"><img src="${LOGO}" style="height:54px;border-radius:12px"><div><h1 style="font-size:22px">Consola de Cocina</h1><p class="sub" style="margin:0">Pedidos del día · por hora de retiro</p></div></div>
 <div style="display:flex;gap:8px;margin:14px 0 4px">${[[L.length,'Pedidos'],[fmt(due),'Por cobrar'],[S.orders.reduce((a,o)=>a+o.qty,0),'Menús']].map(([v,t])=>`<div class="card" style="flex:1;text-align:center;margin:0;padding:10px"><b style="color:var(--gold);font-size:17px">${v}</b><br><span style="font-size:11px;color:var(--mut)">${t}</span></div>`).join('')}</div><h2>Comandas</h2>`;
 L.forEach(o=>{h+=`<div class="card"><div class="row"><b style="color:var(--gold);font-size:18px">🕒 ${o.time}</b><span class="badge ${o.paid?'b-paid':'b-pend'}">${o.paid?'Pagado':'Pendiente de Pago'}</span></div>
 <div class="row" style="padding:0"><b>${o.qty}× ${o.dish}</b><b style="color:var(--gold)">${fmt(price(o))}</b></div><p class="sub" style="margin:2px 0 4px;font-size:12px">#${o.id} · ${o.client}<br>${o.det}${o.notes?`<br>⚠️ ${o.notes}`:''}</p>
 <label>Estado operativo</label><select onchange="setSt(${o.id},this.value)">${STEPS.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select>
 <div class="row" style="margin-top:10px"><span>Pago recibido</span><label class="sw" style="margin:0"><input type="checkbox" ${o.paid?'checked':''} onchange="setPaid(${o.id},this.checked)"><s></s></label></div></div>`});
 h+=`<h2>Gestión de stock</h2>`+S.dishes.map(d=>`<div class="card row"><div><b style="font-size:14px">${d.n}</b><br><span style="font-size:12px;color:var(--mut)">${fmt(d.p)}</span></div><button class="chip ${d.o?'on':''}" onclick="toStock(${d.id})">${d.o?'Agotado':'Marcar agotado'}</button></div>`).join('')+`</main>`;return h}
function accountView(){
 return `<main><h1>Mi cuenta</h1><p class="sub">Administra tus datos</p>
 <div style="text-align:center;margin:8px 0"><div class="avatar">${S.name[0].toUpperCase()}</div><b>${S.name}</b><p class="sub" style="margin:2px 0 0">${S.email}</p></div>
 <h2>Datos personales</h2>
 <label>Nombre completo</label><input id="an" value="${S.name}">
 <label>Correo electrónico</label><input id="ae" type="email" value="${S.email}">
 <label>Teléfono</label><input id="ap" type="tel" value="${S.phone}">
 <button class="btn" onclick="saveAcc()">Guardar cambios</button>
 <button class="btn" style="background:none;border:1.5px solid var(--err);color:var(--err);box-shadow:none" onclick="logout()">Cerrar sesión</button></main>`}
function saveAcc(){S.name=$('an').value.trim()||S.name;S.email=$('ae').value.trim()||S.email;S.phone=$('ap').value.trim()||S.phone;toast('Datos actualizados ✅')}
function logout(){S.tab='login';S.dish=null;S.sides=[];S.salad=null;S.active=null;go('auth')}
function regDone(){const i=document.querySelectorAll('main input');S.name=i[0].value.trim()||'Cliente';if(i[1].value)S.email=i[1].value;if(i[2].value)S.phone=i[2].value;go('menu')}
function setSt(id,v){S.orders.find(o=>o.id==id).status=v;render()}
function setPaid(id,v){S.orders.find(o=>o.id==id).paid=v;render()}
function render(){
 const sy=document.querySelector('main')?.scrollTop||0;let v,nav='';
 if(S.role=='admin')v=adminView();
 else{v={auth:authView,menu:menuView,order:orderView,track:trackView,account:accountView}[S.screen]();
  if(S.screen!='auth')nav=`<nav>${[['menu','🍽️','Menú'],['order','🧾','Pedido'],['track','📍','Seguimiento'],['account','👤','Cuenta']].map(([k,i,t])=>`<button class="${S.screen==k?'on':''}" onclick="go('${k}')"><i>${i}</i>${t}</button>`).join('')}</nav>`}
 $('app').innerHTML=`<div class="status"><span>12:04</span><span>📶 🔋</span></div>${v}${nav}${S.toast?`<div class="toast">${S.toast}</div>`:''}`;
 const m=document.querySelector('main');if(m)m.scrollTop=sy;
}
render();
</script></body></html>
